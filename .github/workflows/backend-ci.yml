name: Backend CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_DB: ci_backend
          POSTGRES_USER: ci_backend
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_backend -d ci_backend"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-bookworm@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read pinned teammate Agent transport contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a389e722373ac066fa644f411ebe46009da11d78
          path: .ci/agent-contract
          sparse-checkout: packages/rag_agent/src/rag_agent/integration
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Locate existing backend and isolated CI settings
        shell: bash
        run: |
          if test -f backend/pyproject.toml; then
            echo 'BACKEND_DIR=backend' >> "$GITHUB_ENV"
          elif test -f pyproject.toml && test -f backend/main.py; then
            echo 'BACKEND_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'Backend project not found'; exit 1
          fi
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key in ('ADMIN_API_KEY', 'AGENT_TOOL_TOKEN', 'AGENT_WRITE_TOKEN', 'AGENT_SERVICE_TOKEN'):
                  value = secrets.token_urlsafe(32)
                  print('::add-mask::' + value)
                  output.write(key + '=' + value + '\n')
          PY
      - name: Locked dependencies, migration, contracts and regression tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ci_backend
          POSTGRES_USER: ci_backend
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          INDEX_PROVIDER: external
          ICT_AGENT_CONTRACT_FILE: ${{ github.workspace }}/.ci/agent-contract/packages/rag_agent/src/rag_agent/integration/contracts.py
        run: |
          uv sync --locked --group dev
          uv run --no-sync python scripts/ci-check.py --check-contracts
      - name: Validate Compose and build image
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          POSTGRES_DB: ci_backend
          POSTGRES_USER: ci_backend
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          REDIS_PASSWORD: ci-only-not-a-deployment-secret
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          # Compose declares env_file:.env. This file exists only in the CI runner.
          names = ('POSTGRES_DB', 'POSTGRES_USER', 'POSTGRES_PASSWORD', 'REDIS_PASSWORD',
                   'ADMIN_API_KEY', 'AGENT_TOOL_TOKEN', 'AGENT_WRITE_TOKEN', 'AGENT_SERVICE_TOKEN')
          with Path('.env').open('x', encoding='utf-8') as output:
              output.write('\n'.join(key + '=' + os.environ[key] for key in names) + '\n')
          Path('.env').chmod(0o600)
          PY
          docker compose config --quiet
          docker build --tag ict-backend:ci .
      - name: Isolated container fault and persistence checks
        working-directory: ${{ env.BACKEND_DIR }}
        run: uv run --no-sync python scripts/verify-fault-recovery.py --image ict-backend:ci
