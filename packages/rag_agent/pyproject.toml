[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-rag-agent"
version = "0.1.0"
description = "Evidence-grounded AI security intelligence RAG service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph==1.2.12", "pydantic==2.13.5", "numpy==2.4.6",
  "rank-bm25==0.2.2", "jieba==0.42.1", "httpx==0.28.1",
  "sentence-transformers==6.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "fastapi==0.142.2", "uvicorn==0.54.0", "beautifulsoup4==4.15.0"]

[project.scripts]
ict-rag = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
